_target_: tensorial.ReaxModule

optimizer:
  _partial_: True
  _target_: optax.adam
  learning_rate: 0.01

#scheduler:
#  _target_: optax.schedules.cosine_decay_schedule
#  init_value: 0.1
#  decay_steps: 400

metrics:
  BEC:
    _target_: tensorial.gcnn.graph_metric
    metric: rmse
    predictions: nodes.predicted_born_charges
    targets: nodes.born_charges
  raman:
    _target_: tensorial.gcnn.graph_metric
    metric: rmse
    predictions: nodes.predicted_raman_tensors
    targets: nodes.raman_tensors

loss_fn:
  _target_: tensorial.gcnn.WeightedLoss
  weights: [ 1000., 1. ]
  loss_fns:
    - _target_: tensorial.gcnn.Loss
      loss_fn: squared_error
      predictions: nodes.predicted_born_charges
      targets: nodes.born_charges

    - _target_: tensorial.gcnn.Loss
      loss_fn: squared_error
      predictions: nodes.predicted_raman_tensors
      targets: nodes.raman_tensors

model:
  _target_: tensorial.nn.Sequential
  layers:
    - _target_: tensorial.gcnn.atomic.SpeciesTransform
      atomic_numbers: ${from_data.atomic_numbers}

    - _target_: tensorial.gcnn.NodewiseEmbedding
      attrs:
        species:
          _target_: tensorial.tensors.OneHot
          num_classes: ${from_data.n_elements}

    - _target_: tensorial.gcnn.EdgeVectors

    - _target_: tensorial.gcnn.EdgewiseEncoding
      attrs:
        edge_vectors:
          _target_: tensorial.tensors.SphericalHarmonic
          irreps: 0e + 1o
          normalise: True

    - _target_: tensorial.gcnn.RadialBasisEdgeEncoding
      r_max: ${r_max}

    # Hidden irreps: ${mul} channels of every irrep up to ${ell_max} (both parities), see
    # tensorial.make_irreps.  mul, ell_max and num_layers are set in train.yaml.
    - _target_: tensorial.gcnn.NodewiseLinear
      field: attributes
      irreps_out:
        _target_: tensorial.make_irreps
        mul: ${mul}
        ell_max: ${ell_max}

    - _target_: tensorial.gcnn.Nequip
      hidden_irreps:
        _target_: tensorial.make_irreps
        mul: ${mul}
        ell_max: ${ell_max}
      num_layers: ${num_layers}
      avg_num_neighbours: ${from_data.avg_num_neighbours}

    # Keep only scalars and reduce the number passing this point
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 4x0e + 4x0o + 4x1e + 4x1o + 4x2e + 4x2o + 2x3o + 2x3e

    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x0e
      out_field: energy # Per-atom energy

    - _target_: tensorial.gcnn.NodewiseReduce
      field: energy
      out_field: predicted_energy  # Total energy

    # Per-atom Born effective charge tensor
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 1x0e + 1x1e + 1x2e
      out_field: predicted_born_charges

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: predicted_born_charges
      attrs:
        predicted_born_charges:
          _target_: tensorial.CartesianTensor
          formula: ij
          i: 1o
          j: 1o

    # Per atom Raman tensors
    - _target_: tensorial.gcnn.NodewiseLinear
      irreps_out: 2x1o + 1x2o + 1x3o
      out_field: predicted_raman_tensors

    - _target_: tensorial.gcnn.NodewiseDecoding
      in_field: predicted_raman_tensors
      attrs:
        predicted_raman_tensors:
          _target_: tensorial.CartesianTensor
          formula: ijk=ikj
          i: 1o
          j: 1o
